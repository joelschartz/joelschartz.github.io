ces</button><button type="button" data-focus-pane="associations">Exercices associés</button><button type="button" data-focus-pane="results">Résultats · Barème</button><button type="button" data-focus-pane="assessment">Compétences par élève</button><button type="button" data-bilan-target="tests">Tests du bilan</button><button type="button" data-bilan-target="results">Résultats du bilan</button><button type="button" data-bilan-target="competencies">Barres par compétence</button></nav><button type="button" class="ge-map-content" data-map-navigate hidden aria-label="Naviguer avec la carte. Entrée rejoint les points sans changer le zoom."><svg viewBox="0 0 180 125" data-map-svg role="img" aria-label="Position des élèves et compétences sur le plan"><rect class="ge-map-background" width="180" height="125" rx="3"></rect><g data-map-shapes></g><rect data-map-camera class="ge-map-camera" x="0" y="0" width="20" height="20" rx="1"></rect></svg></button></div></main>
